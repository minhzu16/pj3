name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expense_tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: OWASP dependency check
        working-directory: backend
        run: mvn -B -q org.owasp:dependency-check-maven:12.2.2:check -DfailBuildOnCVSS=9 -DskipTestScope=true
        continue-on-error: true

      - name: Run Backend Tests, Checkstyle, Spotless & JaCoCo Check
        working-directory: backend
        run: mvn clean verify jacoco:report -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/expense_tracker
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgrespassword

      - name: Print & Publish JaCoCo Coverage Summary
        if: always()
        run: |
          if [ -f backend/target/site/jacoco/jacoco.csv ]; then
            awk -F',' 'NR>1 {
              inst_m+=$4; inst_c+=$5; branch_m+=$6; branch_c+=$7; line_m+=$8; line_c+=$9
            } END {
              printf "JaCoCo Summary -> Instructions: %.2f%% | Branches: %.2f%% | Lines: %.2f%%\n",
                (inst_c/(inst_m+inst_c))*100, (branch_c/(branch_m+branch_c))*100, (line_c/(line_m+line_c))*100
            }' backend/target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package JAR
        working-directory: backend
        run: mvn package -DskipTests -B

  frontend-test:
    name: Frontend Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: frontend
        run: flutter analyze

      - name: Run Flutter Tests
        working-directory: frontend
        run: flutter test
