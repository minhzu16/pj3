services:
  db:
    image: postgres:16-alpine
    container_name: expense_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expense_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-expense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_secure_password_123}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expense_user} -d ${POSTGRES_DB:-expense_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expense_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_prod_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-expense_tracker}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-expense_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-prod_secure_password_123}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://expense.example.com}
    ports:
      - "8080:8080"
    networks:
      - expense_net

  caddy:
    image: caddy:2-alpine
    container_name: expense_prod_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - expense_net

volumes:
  postgres_prod_data:
  caddy_data:
  caddy_config:

networks:
  expense_net:
    driver: bridge
